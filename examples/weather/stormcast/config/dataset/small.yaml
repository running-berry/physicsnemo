name: data_loader_small.Dataset # Dataset class module and name, in any module in `datasets` folder

# Main dataset
location: '../../../dev/data' # Path to the dataset

# Domain
HighRes_img_size: [32, 32] 

# Temporal selection
dt: 1 # Timestep between samples (in multiples of the base HRRR 1hr timestep)
exp_train_zarrs: ["exp"] # Zarr files to use for training
train_dates: ['2019/08/03', '2019/08/03']
exp_valid_zarrs: ["exp"] # Zarr files to use for validation
valid_dates: ['2019/08/03', '2019/08/03']

# Variable selection
invariants: ["lsm", "orog"] # Invariant quantitites to include
input_channels: 'all' #'all' or list of channels to condition on
diffusion_channels: "all" #'all' or list of channels to condition on
kept_LowRes_channels: "all"
kept_HighRes_channels: "all"
