# era.yaml
dataset_root: "./raw"
dataset_name: "era5"
subdir: "train"
start_time: "2020-06-01T00:00:00"
end_time:   "2020-06-01T23:00:00"
save_stats: false  # or true if want enable statistics generation
variables:
  - "u10m"      # 10 metre U wind component
  - "v10m"      # 10 metre V wind component
  - "t2m"       # 2 metre temperature
  - "d2m"       # 2 metre dewpoint temperature
  - "msl"       # Mean sea level pressure
  - "sp"        # Surface pressure
  - "tp"        # Total precipitation